minecraft_version=26.1.2
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=26.1.2
# 基线取 26.1.2，一份包覆盖 26.1 / 26.1.1 / 26.1.2，故范围写到次版本
minecraft_range=~26.1
carpet_range=>=26.1
java_release=25

# 与实机运行的版本一致：编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.155.3+26.1.2
# 地毯在 Modrinth 显示 26.1+v260402，maven 实际只有 26.1+v260401，构建依赖以 maven 为准
carpet_core_version=26.1+v260401
# Mod Menu：只编译时引用（设置界面入口）。版本与实机运行的保持一致（同 fabric_api_version 的理由）
modmenu_version=18.0.2
# Xaero 世界地图及其前置库：只编译时引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
