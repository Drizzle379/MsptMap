minecraft_version=26.1.2
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=26.1.2
# 基线取 26.1.2，一份包覆盖 26.1 / 26.1.1 / 26.1.2，故范围写到次版本
minecraft_range=~26.1
java_release=25

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.144.0+26.1
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=18.0.2
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
# 该 MC 版本的首个小地图构建
xaero_minimap_version=25.3.10
