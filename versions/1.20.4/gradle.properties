minecraft_version=1.20.4
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=1.20.4
# 一份包覆盖 1.20.3 – 1.20.4（该区间 API 相同），编译基线取实机在用的 1.20.4
minecraft_range=>=1.20.3 <1.20.5
carpet_range=>=1.20.3
java_release=17

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.97.1+1.20.4
carpet_core_version=1.20.3-1.4.128+v231205
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由。
# 实机装的是 beta.2，之后没有再发正式版
modmenu_version=9.2.0-beta.2
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
