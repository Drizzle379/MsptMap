minecraft_version=26.3
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=26.3
minecraft_range=~26.3
java_release=25

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.160.5+26.3
# 26.3 正式版自 0.160.5+26.3 起提供构建（此前的 0.158.x 只标快照，启动器渠道拿不到）
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=21.0.0
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.4
xaero_lib_version=1.7.17
# 该 MC 版本的首个小地图构建
xaero_minimap_version=26.5.1
