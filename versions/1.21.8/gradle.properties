minecraft_version=1.21.8
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=1.21.10
# 一份包覆盖 1.21.5 – 1.21.10（该区间 API 相同），编译基线取实机在用的 1.21.8
# 1.21.5 剔除：其 GuiGraphics.drawString 的签名与 1.21.6+ 不同（返回值与参数都变），
# 为 1.21.8 编的产物在 1.21.5 上解析不到该方法（区间交叉核对抓到）
minecraft_range=>=1.21.6 <1.21.11
carpet_range=>=1.21.8
java_release=21

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.136.1+1.21.8
carpet_core_version=1.21.7-1.4.177+v250630
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=15.0.2
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
