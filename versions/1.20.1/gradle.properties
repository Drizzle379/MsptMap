minecraft_version=1.20.1
# 一份包覆盖 1.20 – 1.20.2（该区间 API 相同），编译基线取实机在用的 1.20.1
minecraft_range=>=1.20 <1.20.3
carpet_range=>=1.20
java_release=17

# 与实机运行的版本一致：编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.91.0+1.20.1
carpet_core_version=1.20-1.4.112+v230608
# Mod Menu：只编译时引用（设置界面入口）。版本与实机运行的保持一致（同 fabric_api_version 的理由）
modmenu_version=7.2.2
# Xaero 世界地图及其前置库：只编译时引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
