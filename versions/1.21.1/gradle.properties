minecraft_version=1.21.1
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=1.21.1
# 一份包覆盖 1.20.5 – 1.21.1（该区间 API 相同），编译基线取实机在用的 1.21.1
# 1.20.5 / 1.20.6 剔除：1.21 起 ResourceLocation 的构造器转为 private（1.20.5/6 又还没有
# fromNamespaceAndPath），资源位置的构造形态两侧互斥，同一份产物覆盖不了；且这两个版本本就是
# 没有 Xaero 1.46.0 的夹缝版本（区间交叉核对发现后收窄）
minecraft_range=>=1.21 <1.21.2
carpet_range=>=1.21.1
java_release=21

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.116.17+1.21.1
carpet_core_version=1.21-1.4.147+v240613
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=11.0.5
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
