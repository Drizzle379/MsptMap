minecraft_version=1.21.4
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=1.21.4
# 一份包覆盖 1.21.2 – 1.21.4（该区间 API 相同），编译基线取该区间最后一个版本
minecraft_range=>=1.21.2 <1.21.5
carpet_range=>=1.21.4
java_release=21

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.119.4+1.21.4
carpet_core_version=1.21.4-1.4.161+v241203
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=13.0.4
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.46.0
xaero_lib_version=1.7.3
