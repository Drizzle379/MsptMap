minecraft_version=26.2
# jar 文件名里 "+" 后的版本：本包声明的最高支持版本
jar_mc=26.2
minecraft_range=~26.2
carpet_range=>=26.2
java_release=25

# 编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.158.0+26.2
carpet_core_version=26.2+v260616
# Mod Menu：只编译期引用（设置界面入口），版本同 fabric_api_version 的理由
modmenu_version=20.0.1
# Xaero 世界地图及其前置库：只编译期引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.44.2
xaero_lib_version=1.7.1
