# 每次 push 时在 GitHub 的服务器上编译两个代表版本：
#   26.2   当前活跃版本，需要 Java 25
#   1.20.1 支持范围里最老的版本，需要 Java 17
# 编译结果会挂到对应的 commit 上（通过显示绿勾，失败显示红叉）。失败不阻止本地提交与推送。
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.version }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "26.2"
            java: "25"
          - version: "1.20.1"
            java: "17"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库在 Windows 上开发，gradlew 可能没带可执行位，先补上
      - name: Build ${{ matrix.version }}
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.version }}:build
