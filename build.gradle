plugins {
	// 源码未混淆，故用不 remap 的 loom
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// 地毯（可选依赖：编译时需要，运行时不打包）
	maven { url = 'https://masa.dy.fi/maven' }
	// Xaero 世界地图及其前置库（作者官方 maven；编译时需要，运行时不打包，玩家自己装）
	maven {
		name = "Xaero's Maven"
		url = 'https://chocolateminecraft.com/maven'
	}
	// Mod Menu（编译时需要，运行时不打包：装了才有「模组菜单 → 设置」入口）
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// 未混淆 → 用 implementation 而非 modImplementation
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// 服务端与客户端各自会装 Fabric API，故不打包进 jar（打包只有 include() 会做）。但必须用
	// implementation 而非 compileOnly：后者只在编译期可见，runServer/runClient 的运行时 classpath
	// 上没有它，Fabric Loader 会报 HARD_DEP_NO_CANDIDATE「需要 fabric-api 但没有安装它」。
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 可选依赖：不写 depends，运行时不打包
	compileOnly "carpet:fabric-carpet:${project.carpet_core_version}"
	// 只需其 API 的两个类（ModMenuApi / ConfigScreenFactory），不引入它依赖的 fabric-api（transitive = false）
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	compileOnly "xaero.map:xaeroworldmap-fabric-26.2:${project.xaero_worldmap_version}"
	// 前置库由上面那个包的 pom 带进来，但其版本是区间 [1.7.0,1.8)（会解析成最新 1.7.x），这里钉死实测版本
	compileOnly("xaero.lib:xaerolib-fabric-26.2:${project.xaero_lib_version}") {
		version { strictly "${project.xaero_lib_version}" }
	}

	// MixinExtras 随包发一份 0.5.5，两个理由：
	// ① @Local 属 MixinExtras 功能，版本须与编译所用的那一版一致；
	// ② Mixin 0.17.4 写出的注解形式，Fabric Loader 里带的 0.5.4 认不了。
	include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.5"))
}

group = project.maven_group
base.archivesName = "${project.archives_base_name}-Fabric-${project.minecraft_version}"
version = "v${project.mod_version}"

// fabric.mod.json 里的 ${version} 由这里填。填 mod_version（不带 v）：jar 文件名那个 v 前缀是另一回事，
// 由上面的 version 属性决定。这样升版本只改 gradle.properties 一处，不会两边对不上。
// filteringCharset 须显式写：该文件里有中文描述，靠平台默认编码会乱码。
processResources {
	filteringCharset = "UTF-8"
	// 先取到局部变量：filesMatching 的闭包在【任务执行时】才跑，在那里读 project 会触发 Gradle 的
	// "invocation-of-task-project-at-execution-time" 弃用警告（Gradle 10 会移除该用法）。
	def modVersion = project.mod_version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
