// Loom 的两种形态各对应一个插件 id，按版本择一应用（plugins 块不能写条件，故先声明版本再应用）：
//   net.fabricmc.fabric-loom-remap —— 混淆的 MC（1.20–1.21.11）：需要映射，mod 依赖按映射重映射
//   net.fabricmc.fabric-loom       —— 未混淆的 MC（26.x）：无映射，不做 remap
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// 1.21.11 及以前的 MC 源码是混淆的（26.x 起才不混淆）。判据用版本号而非配置项：26.x 的版本串
// 一律以 "26." 开头。
def obfuscated = !project.minecraft_version.startsWith('26.')
pluginManager.apply(obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')

repositories {
	// 地毯（可选依赖：编译时需要，运行时不打包）
	maven { url = 'https://masa.dy.fi/maven' }
	// Xaero 世界地图及其前置库（作者官方 maven；编译时需要，运行时不打包，玩家自己装）
	maven {
		name = "Xaero's Maven"
		url = 'https://chocolateminecraft.com/maven'
	}
	// Mod Menu（编译时需要，运行时不打包：装了才有「模组菜单 → 设置」入口）
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
	}

	// 声明方式随模式：remap 模式下 mod 依赖须走 Loom 的 mod* 配置，Loom 才会把 jar 重映射到当前映射
	// 空间（fabric-api 的类引用 MC 类型，不重映射就对不上）；未混淆模式无重映射可言，用普通配置。
	// 两者都进运行时 classpath —— loader / fabric-api 都不可用 compileOnly：那只在编译期可见，
	// runServer/runClient 的运行时 classpath 上没有它，Fabric Loader 会报 HARD_DEP_NO_CANDIDATE。
	def core = obfuscated ? 'modImplementation' : 'implementation'
	dependencies.add(core, "net.fabricmc:fabric-loader:${project.loader_version}")
	// 服务端与客户端各自会装 Fabric API，故不打包进 jar（打包只有 include() 会做）。
	dependencies.add(core, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

	// 可选依赖：不写 depends，运行时不打包。混淆版本须用 modCompileOnly —— Loom 会先把 mod 依赖从
	// intermediary 重映射到官方映射，源码才能按官方名引用它们。
	def optional = obfuscated ? 'modCompileOnly' : 'compileOnly'
	dependencies.add(optional, "carpet:fabric-carpet:${project.carpet_core_version}")
	// 只需其 API 的两个类（ModMenuApi / ConfigScreenFactory），不引入它依赖的 fabric-api（transitive = false）
	dependencies.add(optional, "com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	// Xaero 的坐标自带 MC 版本后缀，故随版本变化
	dependencies.add(optional, "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:${project.xaero_worldmap_version}")
	// 前置库由上面那个包的 pom 带进来，但其版本是区间 [1.7.0,1.8)（会解析成最新 1.7.x），这里钉死实测版本
	dependencies.add(optional, "xaero.lib:xaerolib-fabric-${project.minecraft_version}:${project.xaero_lib_version}") {
		version { strictly "${project.xaero_lib_version}" }
	}

	// MixinExtras 随包发一份 0.5.5，两个理由：
	// ① @Local 属 MixinExtras 功能，版本须与编译所用的那一版一致；
	// ② Mixin 0.17.4 写出的注解形式，Fabric Loader 里带的 0.5.4 认不了。
	include(implementation("io.github.llamalad7:mixinextras-fabric:0.5.5"))
}

group = project.maven_group
// jar 名 = MsptMap-Fabric-v<mod 版本>+<最高支持版本>.jar（生态惯例，与 sodium-fabric-…+mc26.2r1 同构）：
// 版本号在前、最高支持版本在后，覆盖范围见 fabric.mod.json 的 depends.minecraft
base.archivesName = "${project.archives_base_name}-Fabric"
version = "v${project.mod_version}+${project.jar_mc}"

// fabric.mod.json 里的占位符由这里填，让该文件与具体版本脱钩：升版本、换 MC 版本都只改
// gradle.properties，不会两边对不上。filteringCharset 须显式写：该文件里有中文描述，
// 靠平台默认编码会乱码。
processResources {
	filteringCharset = "UTF-8"
	// 先取到局部变量：filesMatching 的闭包在任务执行时才跑，在那里读 project 会触发 Gradle 的
	// "invocation-of-task-project-at-execution-time" 弃用警告（Gradle 10 会移除该用法）。
	def modVersion = project.mod_version
	def loaderVersion = project.loader_version
	def javaRelease = project.java_release
	def minecraftRange = project.minecraft_range
	def carpetRange = project.carpet_range
	inputs.property "version", modVersion
	inputs.property "loader_version", loaderVersion
	inputs.property "java_release", javaRelease
	inputs.property "minecraft_range", minecraftRange
	inputs.property "carpet_range", carpetRange
	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"loader_version": loaderVersion,
				"java_release": javaRelease,
				"minecraft_range": minecraftRange,
				"carpet_range": carpetRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = project.java_release as Integer
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_release)
	targetCompatibility = JavaVersion.toVersion(project.java_release)
}
