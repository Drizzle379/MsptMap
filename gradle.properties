# 构建工具
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=false
org.gradle.configuration-cache=false

# 版本
loom_version=1.17.21
loader_version=0.19.3
minecraft_version=26.2
# 与实机运行的版本一致：编译期能看到的 API 不应高于运行时，否则会写出运行时报 NoSuchMethodError 的代码
fabric_api_version=0.158.0+26.2
carpet_core_version=26.2+v260616
# Mod Menu：只编译时引用（设置界面入口）。版本与实机运行的保持一致（同 fabric_api_version 的理由）
modmenu_version=20.0.1
# Xaero 世界地图及其前置库：只编译时引用，运行时不打包（玩家自己装）
xaero_worldmap_version=1.44.2
xaero_lib_version=1.7.1

# 本模组
mod_version=0.2.3
maven_group=msptmap
archives_base_name=MsptMap
