# 构建工具
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.configuration-cache=false

# 用 Groovy 控制器时的官方开关：关掉「Groovy DSL 支持有限」提示警告
dev.kikugie.stonecutter.hard_mode=true

# 与 MC 版本无关的依赖版本
loom_version=1.17.21
loader_version=0.19.3

# 本模组
mod_version=0.4.0
maven_group=msptmap
archives_base_name=MsptMap

# 以下属性按 MC 版本分别写在 versions/<版本>/gradle.properties 里：
#   minecraft_version / minecraft_range / java_release
#   fabric_api_version / modmenu_version
#   xaero_worldmap_version / xaero_lib_version
